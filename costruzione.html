<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Come nasce questa pagina · Giuseppe Trotta</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="Animazione dimostrativa: la landing di Giuseppe Trotta costruita da zero da un gruppo di agenti AI simulati.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0f14'/%3E%3Cpath d='M8 7l7 18 2.6-7.4L25 15z' fill='%2360a5fa' stroke='%23fff' stroke-width='1.5' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #111823;
      --border: #223041;
      --text: #e6edf3;
      --muted: #8b9bb0;
      --blue: #3b82f6;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: radial-gradient(1200px 600px at 70% -10%, #1b2a44 0, transparent 60%), var(--bg);
      color: var(--text);
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    .app { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); height: 100vh; height: 100dvh; }

    /* Prompt (details mode only) */
    .prompt { display: none; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .details .prompt { display: flex; }
    .logo { flex: none; width: 26px; height: 26px; border-radius: 7px; background: conic-gradient(from 200deg, #c084fc, #38bdf8, #4ade80, #facc15, #fb923c, #f472b6, #c084fc); }
    .prompt-box {
      flex: 1;
      min-width: 0;
      padding: 9px 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #cfe0f5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .caret { display: inline-block; width: 2px; height: 1em; margin-left: 1px; vertical-align: -2px; background: var(--blue); animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    #send { flex: none; width: 36px; height: 36px; border: 0; border-radius: 10px; background: #1b2532; color: var(--muted); font-size: 18px; transition: background-color .2s, color .2s; }
    #send.pressed { background: var(--blue); color: #fff; }

    /* Stage */
    .stage { display: grid; grid-row: 2; grid-template-columns: minmax(0, 1fr); min-height: 0; }
    .details .stage { grid-template-columns: minmax(0, 1fr) 380px; }
    .preview { position: relative; display: grid; place-items: center; min-width: 0; min-height: 0; padding: 14px 14px 66px; }
    .device { background: #0f1620; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; box-shadow: 0 30px 80px rgba(0, 0, 0, .5); }
    .chrome { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px; background: #141d29; border-bottom: 1px solid var(--border); }
    .lights i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; border-radius: 50%; background: #ff5f57; }
    .lights i:nth-child(2) { background: #febc2e; }
    .lights i:nth-child(3) { background: #28c840; }
    .url { flex: 1; padding: 4px 10px; border-radius: 6px; background: #0b121b; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .screen { position: relative; overflow: hidden; background: #fff; }
    .screen iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; background: #fff; }
    .device.mobile { padding: 10px; border: 2px solid #2a3646; border-radius: 34px; background: #05080c; }
    .device.mobile .chrome { display: none; }
    .device.mobile .screen { border-radius: 24px; }

    /* Side panel (details mode only) */
    .panel { display: none; flex-direction: column; gap: 12px; min-width: 0; min-height: 0; padding: 16px 16px 76px; border-left: 1px solid var(--border); background: rgba(10, 15, 22, .6); }
    .details .panel { display: flex; }
    .label { margin: 0 0 6px; color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .swarm { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
    .swarm span { aspect-ratio: 1; border-radius: 50%; background: var(--c); opacity: .35; transition: opacity .2s, transform .2s; }
    .swarm span.working { opacity: 1; transform: scale(1.15); }

    .editor { display: flex; flex-direction: column; flex: 1; min-height: 120px; background: #0a1018; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .tab { display: flex; justify-content: space-between; gap: 8px; padding: 7px 12px; background: #121a25; border-bottom: 1px solid var(--border); color: var(--muted); font: 12px ui-monospace, Consolas, monospace; }
    #code {
      display: flex;
      flex: 1;
      flex-direction: column;
      justify-content: flex-end;
      margin: 0;
      padding: 10px 12px;
      overflow: hidden;
      color: #c9d6e3;
      font: 12px/1.55 "Cascadia Code", Consolas, ui-monospace, monospace;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .line { display: grid; grid-template-columns: 30px 1fr; }
    .line .n { padding-right: 10px; color: #3d4b5c; text-align: right; }
    .k, .a, .s { font-style: normal; }
    .k { color: #7cc4ff; }
    .a { color: #f5c26b; }
    .s { color: #9be28f; }
    .cur { display: inline-block; width: 7px; height: 1.1em; vertical-align: -3px; background: #7cc4ff; animation: blink 1s steps(1) infinite; }

    .log { display: flex; flex-direction: column; justify-content: flex-end; gap: 3px; max-height: 170px; margin: 0; padding: 0; overflow: hidden; list-style: none; font-size: 12.5px; }
    .log li { color: var(--muted); animation: enter .3s both; }
    .log b { color: var(--c); }
    .log .ok { color: #4ade80; }
    .log .ko { color: #f87171; }
    @keyframes enter { from { opacity: 0; transform: translateY(6px); } }

    /* Bottom bar */
    .bar {
      position: fixed;
      left: 50%;
      bottom: 14px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: calc(100vw - 16px);
      padding: 6px 8px 6px 12px;
      background: rgba(13, 18, 26, .94);
      border: 1px solid #2a3646;
      border-radius: 999px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .45);
      white-space: nowrap;
      transform: translateX(-50%);
      transition: opacity .25s, transform .25s;
      backdrop-filter: blur(8px);
    }
    .bar.hidden { opacity: 0; pointer-events: none; transform: translate(-50%, 12px); }
    .faces { display: flex; }
    .face { width: 14px; height: 14px; margin-left: -5px; border: 2px solid #0d121a; border-radius: 50%; background: var(--c); }
    .face:first-child { margin-left: 0; }
    .num { font-weight: 700; font-variant-numeric: tabular-nums; }
    .muted { color: var(--muted); }
    .progress { width: 90px; height: 3px; overflow: hidden; border-radius: 2px; background: #223041; }
    .progress i { display: block; width: 0; height: 100%; background: linear-gradient(90deg, #3b82f6, #4ade80); transition: width .2s; }
    .tool { min-width: 6.5em; color: var(--muted); font-size: 12px; }
    .tool:not(:empty)::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; background: #60a5fa; vertical-align: 1px; }
    .bar button { padding: 4px 9px; border: 1px solid #2a3646; border-radius: 999px; background: #1b2532; color: var(--text); font: 600 12px system-ui, sans-serif; cursor: pointer; }
    .bar button:hover { background: #243244; }
    .bar .close { padding: 4px 7px; border-color: transparent; background: none; color: var(--muted); }

    .toast {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 6;
      max-width: calc(100vw - 32px);
      padding: 22px 26px;
      background: rgba(13, 18, 26, .95);
      border: 1px solid #2a3646;
      border-radius: 16px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .6);
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(.9);
      transition: opacity .35s, transform .35s;
    }
    .toast.show { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%); }
    .toast h2 { margin: 0 0 6px; font-size: 20px; }
    .toast p { margin: 0; color: var(--muted); }

    @media (orientation: portrait), (max-width: 820px) {
      .details .stage { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
      .preview { padding: 10px 10px 58px; }
      .details .preview { padding-bottom: 8px; }
      .panel { gap: 8px; padding: 10px 12px 62px; border-top: 1px solid var(--border); border-left: 0; }
      .panel .label, .log { display: none; }
      .swarm { grid-template-columns: repeat(15, 1fr); gap: 4px; }
      .editor { flex: none; height: 96px; min-height: 0; }
      .bar { gap: 7px; padding-left: 10px; font-size: 12px; }
      .bar button { padding: 3px 7px; font-size: 11px; }
      .bar .optional { display: none; }
    }
  </style>
</head>

<a class="br-note" href="./">Animazione simulata · ← Torna al sito</a>
<style>
  .br-note { position: fixed; top: calc(8px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 50;

</style>
<div class="app" id="app">
  <header class="prompt">
    <span class="logo" aria-hidden="true"></span>
    <div class="prompt-box"><span id="prompt"></span><span class="caret"></span></div>
    <button id="send" type="button" tabindex="-1" aria-hidden="true">&#8629;</button>
  </header>

  <main class="stage">
    <section class="preview" id="preview">
      <div class="device" id="device">
        <div class="chrome"><span class="lights"><i></i><i></i><i></i></span><div class="url" id="url"></div></div>
        <div class="screen" id="screen"><iframe id="page" title="Page under construction"></iframe></div>
      </div>
    </section>
    <aside class="panel">

        <div class="swarm" id="swarm"></div>
      </div>

  </main>

  <div class="bar" id="bar">
    <span class="faces" id="faces"></span>
    <span><span class="num" id="n-agents">0</span> <span class="muted" id="agents-label">agents</span></span>
    <span><span class="num" id="n-layers">0</span><span class="muted"> / <span id="total-layers">0</span> <span id="layers-label">layers</span></span></span>
    <span class="tool optional" id="tool"></span>
    <span class="progress optional"><i id="progress"></i></span>
    <span class="num muted optional" id="clock">00:00</span>
    <button id="replay" type="button">Replay</button>
    <button id="speed" type="button">1x</button>
    <button id="view" type="button" class="optional">Mobile</button>
    <button id="details" type="button" class="optional">Details</button>
    <button id="pause" type="button" aria-label="Pause">&#10074;&#10074;</button>
    <button id="close" type="button" class="close" aria-label="Hide the bar (H shows it again)">&#10005;</button>
  </div>

  <div class="toast" id="toast" role="status"></div>
</div>

<script>
  // Configurazione per la landing di Giuseppe Trotta (pubblicata accanto a index.html)
  window.BUILDREEL = {
    page: 'index.html',
    url: 'giuseppetrotta82.github.io',
    lang: 'it',
    tempo: 1.3,   // ritmo base di 1x (predefinito 1.6): più basso = più lento
    agents: { desktop: 30, mobile: 20 },
    prepare: function (doc) {
      // Il link "Vai al contenuto" e il campo anti-bot sono fuori schermo: non vanno costruiti
      doc.querySelectorAll('.skip, .trap').forEach(function (el) { el.remove(); });
    }
  };
</script>
<script>
/*
 * BuildReel: a simulated swarm of AI agents builds an existing web page from scratch.
 * It is a staged animation: no real agent runs. It reads the page in the iframe, hides every
 * element, then "builds" it back: boxes dragged like in a design tool, text typed letter by
 * letter, section backgrounds wiped in. At the end it runs a few real checks on the page.
 *
 * Optional configuration: define window.BUILDREEL before this script, or use URL parameters
 * (?page=, ?view=, ?speed=, ?loop=1, ?details=1, ?lang=, ?url=, ?prompt=).
 */
(function () {
  'use strict';

  var DEFAULTS = {
    page: 'example/index.html',     // page to build, same origin as this file
    url: '',                        // text in the fake address bar (default: the page path)
    prompt: '',                     // text typed in details mode (default: per language)
    view: '',                       // 'desktop' | 'mobile' (default: from window orientation)
    speed: 1,                       // 1, 2 or 4
    tempo: 1.6,                     // base pace: how much faster than the original timings 1x runs
    loop: false,                    // start again 4 s after the end
    details: false,                 // show prompt, code and log
    lang: '',                       // 'en' | 'it' (default: from the browser)
    agents: { desktop: 30, mobile: 20 },
    frames: null,                   // selectors of section backgrounds; null = automatic
    components: null,               // selectors of components, in build order; null = automatic
    holdUntilEnd: [],               // selectors kept hidden until the end (fixed bars, cookie notices…)
    prepare: null                   // function (doc) run before building, e.g. to disable the page's own reveal effects
  };

  var TEXT = {
    en: {
      ready: 'agents ready', agents: 'agents', agent: 'agent', layers: 'layers', checks: 'checks',
      replay: 'Replay', details: 'Details', desktop: 'Desktop', mobile: 'Mobile', agentsTitle: 'Agents',
      prompt: 'Build this page from scratch',
      plan: function (s, c, l) { return ['# Build plan', '- ' + s + ' sections', '- ' + c + ' components', '- ' + l + ' layers', '- check the result at 320 px']; },
      director: 'Director', checker: 'Checker',
      tools: { frame: 'Frame', rect: 'Rectangle', text: 'Text', image: 'Image', copy: 'Duplicate' },
      acts: { frame: 'layout', rect: 'drawing', text: 'writing', image: 'placing image', copy: 'duplicating' },
      started: function (n, l, c) { return n + ' agents, ' + l + ' layers, ' + c + ' components'; },
      component: function (name, n) { return name + ': ' + n + (n === 1 ? ' layer' : ' layers'); },
      done: 'Page ready in ',
      check: ['No horizontal overflow at 320 px', 'All images loaded', 'Exactly one main heading (H1)', 'No cookies and no third-party requests', 'Every image has alternative text'],
      unavailable: 'Preview not available',
      blocked: 'The browser blocks the preview when this file is opened from disk. Serve the folder instead, for example: python -m http.server 8000',
      missing: 'Page not found: ',
      empty: 'The page has no visible elements to build.'
    },
    it: {
      ready: 'agenti pronti', agents: 'agenti', agent: 'agente', layers: 'livelli', checks: 'verifica',
      replay: 'Rivedi', details: 'Dettagli', desktop: 'Desktop', mobile: 'Mobile', agentsTitle: 'Agenti',
      prompt: 'Costruisci questa pagina da zero',
      plan: function (s, c, l) { return ['# Piano', '- ' + s + ' sezioni', '- ' + c + ' componenti', '- ' + l + ' livelli', '- verifica finale a 320 px']; },
      director: 'Regista', checker: 'Verifica',
      tools: { frame: 'Cornice', rect: 'Rettangolo', text: 'Testo', image: 'Immagine', copy: 'Duplica' },
      acts: { frame: 'layout', rect: 'disegna', text: 'scrive', image: 'immagine', copy: 'duplica' },
      started: function (n, l, c) { return n + ' agenti, ' + l + ' livelli, ' + c + ' componenti'; },
      component: function (name, n) { return name + ': ' + n + (n === 1 ? ' livello' : ' livelli'); },
      done: 'Pagina pronta in ',
      check: ['Nessuno sforamento orizzontale a 320 px', 'Immagini caricate', 'Un solo titolo principale (H1)', 'Nessun cookie e nessuna richiesta a terzi', 'Ogni immagine ha il testo alternativo'],
      unavailable: 'Anteprima non disponibile',
      blocked: 'Il browser blocca l\'anteprima quando il file è aperto dal disco. Servi la cartella, per esempio: python -m http.server 8000',
      missing: 'Pagina non trovata: ',
      empty: 'La pagina non ha elementi visibili da costruire.'
    }
  };

  var NOISE_COLORS = ['#1e3a8a', '#2563eb', '#60a5fa', '#22c55e', '#facc15', '#fb923c', '#f472b6', '#ef4444', '#94a3b8'];

  var FRAME_STYLE = [
    '.br-x{visibility:hidden!important}',
    '.br-c{visibility:hidden}',
    '.br-c.br-v{visibility:visible}',
    '.br-caret{display:inline-block;width:2px;height:1em;margin-right:-2px;vertical-align:-.12em;background:#2563eb;visibility:visible;animation:brblink .7s steps(1) infinite}',
    '@keyframes brblink{50%{opacity:0}}',
    '#br-overlay{position:absolute;left:0;top:0;width:100%;pointer-events:none;z-index:2147483647;--k:1}',
    '#br-overlay>*{position:absolute}',
    '.br-box{border:calc(1px*var(--k)) solid rgba(37,99,235,.9);background:rgba(59,130,246,.06);transition:opacity .3s}',
    '.br-box.guide{border-style:dashed;border-color:rgba(100,116,139,.6);background:none}',
    '.br-handle{width:calc(6px*var(--k));height:calc(6px*var(--k));background:#fff;border:calc(1px*var(--k)) solid #2563eb;transform:translate(-50%,-50%);transition:opacity .3s}',
    '.br-noise{image-rendering:pixelated;opacity:.75;background-size:calc(36px*var(--k)) calc(36px*var(--k));animation:brnoise .1s steps(1) infinite;transition:opacity .12s}',
    '@keyframes brnoise{0%{background-position:0 0}33%{background-position:calc(13px*var(--k)) calc(7px*var(--k))}66%{background-position:calc(-9px*var(--k)) calc(15px*var(--k))}}',
    '.br-chip{padding:calc(2px*var(--k)) calc(4px*var(--k));border-radius:calc(2px*var(--k));background:#2563eb;color:#fff;font:600 calc(9px*var(--k))/1 ui-monospace,Consolas,monospace;white-space:nowrap;transition:opacity .3s}',
    '.br-chip.below{transform:translate(-50%,calc(3px*var(--k)))}',
    '.br-chip.above{transform:translate(-100%,calc(-100% - 3px*var(--k)))}',
    '.br-chip.red{background:#ef4444}',
    '.br-cursor{left:0;top:0;will-change:transform;transition-property:transform,opacity;transition-timing-function:cubic-bezier(.3,.7,.2,1)}',
    '.br-cursor svg{display:block;width:calc(20px*var(--k));height:calc(20px*var(--k));filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}',
    '.br-tag b{font-weight:500;opacity:.9}',
    '.br-tag{position:absolute;left:calc(15px*var(--k));top:calc(17px*var(--k));padding:calc(2px*var(--k)) calc(6px*var(--k));border-radius:calc(4px*var(--k));color:#fff;font:600 calc(12px*var(--k))/1.2 system-ui,sans-serif;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.3)}',
    '.br-cursor .ibeam{display:none;transform:translate(-50%,-50%)}',
    '.br-cursor.text .ibeam{display:block}',
    '.br-cursor.text .arrow{display:none}',
    '.br-box.field{border-color:rgba(37,99,235,.55);background:none}',
    '.br-box.ghost{border-style:dashed;background:rgba(59,130,246,.12)}',
    '.br-box>.br-chip{position:absolute;left:0;top:0;transform:translateY(calc(-100% - 3px*var(--k)))}',
    '.br-scan{height:calc(2px*var(--k));background:#60a5fa;box-shadow:0 0 calc(10px*var(--k)) #60a5fa}',
    '.br-gone{display:none!important}',
    '.br-old.sel{background:rgba(37,99,235,.3)}'
  ].join('\n');

  /* ---------- configuration ---------- */

  var params = new URLSearchParams(location.search);
  var CONFIG = Object.assign({}, DEFAULTS, window.BUILDREEL || {});
  ['page', 'url', 'prompt', 'view', 'lang'].forEach(function (k) { if (params.get(k)) CONFIG[k] = params.get(k); });
  if (params.get('speed')) CONFIG.speed = Number(params.get('speed'));
  if (params.get('tempo')) CONFIG.tempo = Number(params.get('tempo'));
  if (params.get('loop')) CONFIG.loop = params.get('loop') === '1';
  if (params.get('details')) CONFIG.details = params.get('details') === '1';

  var lang = TEXT[CONFIG.lang] ? CONFIG.lang : /^it\b/i.test(navigator.language || '') ? 'it' : 'en';
  var T = TEXT[lang];
  document.documentElement.lang = lang;

  var $ = function (id) { return document.getElementById(id); };
  var iframe = $('page'), screenEl = $('screen'), device = $('device'), preview = $('preview'), app = $('app');

  var view = CONFIG.view === 'mobile' || CONFIG.view === 'desktop' ? CONFIG.view : innerHeight > innerWidth ? 'mobile' : 'desktop';
  // rate is the button (1x, 2x, 4x); speed is what the timings use
  var tempo = CONFIG.tempo > 0 ? CONFIG.tempo : 1;
  var rate = [1, 2, 4].indexOf(CONFIG.speed) >= 0 ? CONFIG.speed : 1;
  var speed = rate * tempo;
  if (CONFIG.details) app.classList.add('details');

  var run = 0, paused = false, running = false, elapsed = 0;
  var W, H, baseW, S = 1;
  var doc, win, overlay, total = 0, done = 0, lineNo = 0, colors = [], cursors = [], free = [], noise = [];
  var camera = { y: 0, on: false };

  $('replay').textContent = T.replay;
  $('details').textContent = T.details;
  $('layers-label').textContent = T.layers;
  $('t-agents-title').textContent = T.agentsTitle;
  $('url').textContent = CONFIG.url || CONFIG.page;

  /* ---------- time, pause, speed ---------- */

  function Stop() {}

  function wait(ms, r) {
    return new Promise(function (ok, ko) {
      var t = 0, before = performance.now();
      (function step(now) {
        if (r !== run) return ko(new Stop());
        if (!paused) t += (now - before) * speed;
        before = now;
        if (t >= ms) ok(); else requestAnimationFrame(step);
      })(before);
    });
  }

  function rand(a, b) { return a + Math.random() * (b - a); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function mmss(ms) {
    var s = Math.floor(ms / 1000);
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }

  /* ---------- preview size ---------- */

  }

    var cs = getComputedStyle(preview);
    var aw = preview.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var ah = preview.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var extraW = view === 'mobile' ? 24 : 2, extraH = view === 'mobile' ? 24 : 36;

  }

  function resize() {
    screenEl.style.width = W * S + 'px';
    screenEl.style.height = H * S + 'px';

    li.appendChild(b);
    li.appendChild(document.createTextNode(text));

      e.className = outcome;
      e.textContent = outcome === 'ok' ? '  ✓' : '  ✗';

    $('file').textContent = file;
    $('who').textContent = who;
    $('who').style.color = color;
    var code = $('code');
    var line = document.createElement('div');
    line.className = 'line';
    line.innerHTML = '<span class="n">' + (++lineNo) + '</span><span class="t"></span>';

  function fade(d, r) {

  }

        '<svg class="ibeam" viewBox="0 0 13 13"><path d="M4 1.5h5M4 11.5h5M6.5 1.5v10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M4 1.5h5M4 11.5h5M6.5 1.5v10" fill="none" stroke="' + col + '" stroke-width="1.4" stroke-linecap="round"/></svg>' +
        // A name tag with the current job, like collaborators in a design tool

      d.style.setProperty('--c', col);

  function move(i, x, y, duration) {

      c.dataset.onStage = '1';
      c.style.transitionDuration = '0ms';
      c.style.transform = 'translate(' + (win.innerWidth * rand(.35, .65)) + 'px,' + (win.scrollY + win.innerHeight + 10) + 'px)';
      c.getBoundingClientRect();
      duration = Math.max(duration, 380);

  function reveal(el, mode) {

        { clipPath: 'inset(0 0 0 0)', filter: pale, offset: .55 },

  }

  function isBar(rc) { return rc.h <= 16 && rc.w >= 60 && rc.w >= rc.h * 6; }

  /* ---------- typed text ---------- */

  // Wraps each letter (or word, in long texts) in an invisible element: the layout stays identical.
  // Custom tags, not spans, so the page's own CSS (e.g. ".menu span") never matches them; one wrapper

    var hold = (CONFIG.holdUntilEnd || []).join(',');

      var p = n.parentElement;
      if (!p || p.closest('script, style, svg, #br-overlay' + (hold ? ',' + hold : '')) || !p.getClientRects().length) continue;
      for (var a = p; a && !byEl.has(a); a = a.parentElement) {}
      if (a) nodes.push({ node: n, v: byEl.get(a) });

    nodes.forEach(function (x) { x.v.length = (x.v.length || 0) + x.node.nodeValue.trim().length; });
    nodes.forEach(function (x) {
      var v = x.v, mode = v.length <= 60 ? 'letters' : 'words';

      v.text = (v.text || '') + x.node.nodeValue;
      v.units = v.units || [];
      v.wrapped = v.wrapped || [];

      var parts = mode === 'letters' ? Array.from(x.node.nodeValue) : x.node.nodeValue.match(/\s+|\S+\s*/g);

  /* ---------- layers, frames and components ---------- */

  function takeAgent(r) {

  function release(i) {

  function count() {

  function build(i, v, comp, r) {

    return wait(rand(140, 220), r).then(function () {

        var chip = layer('br-chip ' + (wide ? 'above' : 'below') + (Math.random() < .06 ? ' red' : ''), wide ? rc.x + rc.w : rc.x + rc.w / 2, wide ? rc.y : rc.y + rc.h);
        chip.textContent = Math.round(rc.w) + ' × ' + Math.round(rc.h);

  /* ---------- repeated cards: build the first, duplicate it, retype the copies ---------- */

  function firstClass(el) {
    return (typeof el.className === 'string' && el.className.trim().split(/\s+/)[0]) || '';
  }

  function inside(v, items) {
    return items.filter(function (w) { return w !== v && v.el.contains(w.el); })
      .sort(function (a, b) { return a.el.compareDocumentPosition(b.el) & 4 ? -1 : 1; });
  }

  // Siblings with the same tag, the same first class and the same inner layers are copies of the first one
  function findCopies(comp) {
    var items = comp.items, taken = new Set(), copies = [];
    items.forEach(function (v) {
      if (taken.has(v) || v.rc.w * v.rc.h < 3000) return;
      var kind = v.el.tagName + '.' + firstClass(v.el);
      var sibs = items.filter(function (w) {
        return !taken.has(w) && w.el.parentElement === v.el.parentElement && w.el.tagName + '.' + firstClass(w.el) === kind;
      });
      if (sibs.length < 2 || sibs[0] !== v) return;
      var trees = sibs.map(function (w) { return [w].concat(inside(w, items)); });
      var shape = trees.map(function (t) { return t.map(function (w) { return w.el.tagName; }).join(); });
      if (trees[0].length < 2 || shape.some(function (s) { return s !== shape[0]; })) return;
      trees.forEach(function (t) { t.forEach(function (w) { taken.add(w); }); });
      trees.slice(1).forEach(function (t) { copies.push({ items: t, template: trees[0] }); });
    });
    var copied = new Set();
    copies.forEach(function (cp) { cp.items.forEach(function (w) { copied.add(w); }); });
    comp.items = items.filter(function (w) { return !copied.has(w); });
    comp.copies = copies;
    comp.size = items.length;
  }

  function duplicate(i, cp, comp, r) {
    var from = rect(cp.template[0].el), to = rect(cp.items[0].el);
    follow(to);
    setTool('copy', i);
    move(i, from.x + from.w * .3, from.y + from.h * .3, rand(160, 240));
    return wait(240, r).then(function () {
      // A ghost of the first card slides to its new place
      var ghost = layer('br-box ghost', from.x, from.y, from.w, from.h);
      var chip = doc.createElement('div');
      chip.className = 'br-chip';
      chip.textContent = T.tools.copy;
      ghost.appendChild(chip);
      var duration = clamp(220 + Math.hypot(to.x - from.x, to.y - from.y) * .5, 300, 650);
      ghost.animate([
        { left: from.x + 'px', top: from.y + 'px', width: from.w + 'px', height: from.h + 'px' },
        { left: to.x + 'px', top: to.y + 'px', width: to.w + 'px', height: to.h + 'px' }
      ], { duration: duration / speed, easing: 'cubic-bezier(.3,.7,.2,1)', fill: 'forwards' });
      move(i, to.x + to.w * .3, to.y + to.h * .3, duration);
      return wait(duration, r).then(function () {
        // The copy lands with the text of the first card
        var texts = [];
        cp.items.forEach(function (w, k) {
          reveal(w.el, w.visual ? 'fill' : null);
          if (!w.units) { w.built = true; count(); comp.done++; return; }
          var old = (cp.template[k].text || '').replace(/\s+/g, ' ').trim();
          w.wrapped.forEach(function (x) { x.wrapper.classList.add('br-gone'); });
          var o = doc.createElement('br-old');
          o.className = 'br-old';
          o.textContent = old;
          w.wrapped[0].wrapper.parentNode.insertBefore(o, w.wrapped[0].wrapper);
          texts.push({ v: w, old: o });
        });
        return wait(260, r).then(function () {
          fade(ghost, r);
          // Then each text is selected and typed over
          return texts.reduce(function (p, t) {
            return p.then(function () {
              var rc = t.old.getBoundingClientRect();
              move(i, rc.left + win.scrollX, rc.top + win.scrollY + rc.height * .55, rand(120, 180));
              t.old.classList.add('sel');
              return wait(rand(160, 240), r).then(function () {
                t.old.remove();
                t.v.wrapped.forEach(function (x) { x.wrapper.classList.remove('br-gone'); });
                return type(i, t.v, r);
              }).then(function () { t.v.built = true; count(); comp.done++; });
            });
          }, Promise.resolve());
        });
      });
    });
  }

  function buildComponent(comp, r) {
    log(T.director, '#c084fc', T.component(comp.name, comp.size));
    if (comp.frame && !comp.frame.done) {
      comp.frame.done = true;
      reveal(comp.frame.el, 'wipe');
      count();
    }
    follow({ y: comp.rc.y, h: comp.rc.h });
    // Copies go last and wait until their first card is built
    var queue = comp.items.concat(comp.copies);
    var crew = clamp(Math.ceil(queue.length / 3), 2, 7), agents = [];
    function job(i, v) {
      if (!v.template) return build(i, v, comp, r).then(function () { comp.done++; });
      return (function ready() {
        if (v.template.every(function (w) { return w.built; })) return duplicate(i, v, comp, r);
        // No idle cursor standing on the page while it waits
        cursors[i].style.opacity = '0';
        delete cursors[i].dataset.onStage;
        return wait(60, r).then(ready);
      })();
    }
    for (var k = 0; k < crew; k++) {
      agents.push(wait(k * rand(40, 90), r).then(function () { return takeAgent(r); }).then(function (i) {
        $('swarm').children[i].classList.add('working');
        updateBar();
        return (function loop() {
          var v = queue.shift();
          if (!v) { release(i); return null; }
          return job(i, v).then(loop);
        })();
      }));
    }
    return Promise.all(agents).then(function () { comp.finished = true; });
  }

  // Each component starts when the previous one is a third done: two or three crews work at once
  function buildAll(components, r) {
    var all = [];
    return components.reduce(function (p, comp) {
      return p.then(function () {
        all.push(buildComponent(comp, r));
        return (function hold() {
          if (comp.finished || comp.done >= comp.size * .34) return null;
          return wait(50, r).then(hold);
        })();
      });
    }, Promise.resolve()).then(function () { return Promise.all(all); });
  }

  // The camera follows the front of the build: the newest work sits a little below the middle
  // of the screen, and the page only scrolls down, a bit at every element
  function follow(rc) {
    camera.y = Math.max(camera.y, rc.y + Math.min(rc.h, H * .4) / 2 - H * .55);
  }

  // The camera follows the work with a smooth scroll
  function startCamera(r) {
    var before = performance.now();
    (function step(now) {
      if (r !== run || !camera.on) return;
      var dt = now - before;
      before = now;
      if (!paused) {
        var max = doc.documentElement.scrollHeight - win.innerHeight;
        var target = clamp(camera.y, 0, max), y = win.scrollY;
        if (Math.abs(target - y) > .5) win.scrollTo(0, y + (target - y) * Math.min(1, dt * speed * .0025));
      }
      requestAnimationFrame(step);
    })(before);
  }

  /* ---------- final checks: real measurements of the page ---------- */

  function animateWidth(from, to, duration, r) {
    var t0 = null;
    return new Promise(function (ok, ko) {
      (function step(now) {
        if (r !== run) return ko(new Stop());
        if (t0 === null) t0 = now;
        var p = Math.min(1, (now - t0) * speed / duration), e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
        W = Math.round(from + (to - from) * e);
        resize();
        if (p < 1) requestAnimationFrame(step); else ok();
      })(performance.now());
    });
  }

  function checks(r) {
    var results = [], RED = '#f87171';
    setAgentsLabel(T.agents + ' · ' + T.checks);
    // Cursors still sit at desktop coordinates: hide them so they do not fake the 320 px measurement
    overlay.style.display = 'none';
    win.scrollTo({ top: 0, behavior: 'instant' });
    function probe(k, fn) {
      return wait(300, r).then(fn).then(function (ok) {
        results.push(ok);
        log(T.checker, RED, T.check[k], ok ? 'ok' : 'ko');
      });
    }
    return probe(0, function () {
      return animateWidth(W, 320, 1100, r).then(function () { return wait(400, r); }).then(function () {
        var ok = doc.documentElement.scrollWidth <= doc.documentElement.clientWidth;
        return animateWidth(320, baseW, 900, r).then(function () { return ok; });
      });
    }).then(function () {
      return probe(1, function () {
        return [].every.call(doc.images, function (i) { return i.complete && i.naturalWidth > 0; });
      });
    }).then(function () {
      return probe(2, function () { return doc.querySelectorAll('h1').length === 1; });
    }).then(function () {
      return probe(3, function () {
        var origin = win.location.origin;
        return doc.cookie === '' && win.performance.getEntriesByType('resource').every(function (e) { return e.name.indexOf(origin) === 0; });
      });
    }).then(function () {
      return probe(4, function () {
        return [].every.call(doc.images, function (i) { return i.hasAttribute('alt'); });
      });
    }).then(function () {
      return results;
    });
  }

  /* ---------- start ---------- */

  function fail(text) {
    var t = $('toast');
    t.innerHTML = '<h2></h2><p></p>';
    t.querySelector('h2').textContent = T.unavailable;
    t.querySelector('p').textContent = text;
    t.classList.add('show');
  }

  function prepare() {
    doc = iframe.contentDocument;
    win = iframe.contentWindow;
    if (!doc || !doc.body) throw new Error('blocked');
    doc.documentElement.style.scrollBehavior = 'auto';
    if (typeof CONFIG.prepare === 'function') CONFIG.prepare(doc);
    var style = doc.createElement('style');
    style.textContent = FRAME_STYLE;
    doc.head.appendChild(style);
    var layers = collect();
    if (!layers.length) throw new Error('empty');
    var plan = organize(layers);
    layers.forEach(function (v) { v.el.classList.add('br-x'); });
    (CONFIG.holdUntilEnd || []).forEach(function (sel) { doc.querySelectorAll(sel).forEach(function (e) { e.classList.add('br-x'); }); });
    overlay = doc.createElement('div');
    overlay.id = 'br-overlay';
    overlay.style.height = doc.documentElement.scrollHeight + 'px';
    doc.body.appendChild(overlay);
    resize();
    plan.total = plan.frames.length + plan.components.reduce(function (n, c) { return n + c.size; }, 0);
    return plan;
  }

  function start() {
    var r = ++run;
    var details = app.classList.contains('details');
    var nAgents = CONFIG.agents[view] || (view === 'mobile' ? 20 : 30);
    paused = false;
    $('pause').innerHTML = '&#10074;&#10074;';
    $('toast').classList.remove('show');
    $('log').innerHTML = '';
    $('code').innerHTML = '';
    $('prompt').textContent = '';
    $('send').classList.remove('pressed');
    done = 0;
    total = 0;
    lineNo = 0;
    elapsed = 0;
    overlay = null;
    cursors = [];
    free = [];
    running = false;
    camera = { y: 0, on: false };
    setView();
    setTool('');
    setAgentsLabel(T.ready);
    makeNoise();

    var plan;
    var loaded = new Promise(function (ok) { iframe.onload = ok; });

    // Check the page exists before loading it: a 404 page would otherwise be "built"
    fetch(CONFIG.page, { method: 'HEAD', cache: 'no-store' }).then(function (res) {
      if (!res.ok) throw new Error('missing');
    }, function () { /* opened from disk: fetch fails, the iframe check below explains */ }).then(function () {
      if (r !== run) throw new Stop();
      iframe.src = CONFIG.page + (CONFIG.page.indexOf('?') < 0 ? '?' : '&') + 'buildreel=' + r;
      return loaded;
    }).then(function () {
      if (r !== run) throw new Stop();
      plan = prepare();
      total = plan.total;
      makeCursors(nAgents);
      updateBar();
      if (!details) return wait(500, r);
      var i = 0, prompt = CONFIG.prompt || T.prompt;
      return (function typePrompt() {
        $('prompt').textContent = prompt.slice(0, ++i);
        return i < prompt.length ? wait(22, r).then(typePrompt) : wait(300, r);
      })().then(function () {
        $('send').classList.add('pressed');
        return T.plan(plan.frames.length, plan.components.length, total).reduce(function (p, line) {
          return p.then(function () { writeCode('plan.md', T.director, '#c084fc', line, 'md', r); return wait(320, r); });
        }, Promise.resolve());
      });
    }).then(function () {
      running = true;
      plan.silent.forEach(function (v) { v.el.classList.remove('br-x'); });
      log(T.director, '#c084fc', T.started(nAgents, total, plan.components.length));
      return wait(300, r);
    }).then(function () {
      setAgentsLabel(T.agents);
      camera.on = true;
      startCamera(r);
      return buildAll(plan.components, r);
    }).then(function () {
      plan.frames.forEach(function (v) { if (!v.done) { v.done = true; reveal(v.el, 'wipe'); count(); } });
      cursors.forEach(function (c) { c.style.opacity = '0'; });
      setTool('');
      camera.y = 0;
      return wait(1400, r);
    }).then(function () {
      camera.on = false;
      return checks(r);
    }).then(function (results) {
      (CONFIG.holdUntilEnd || []).forEach(function (sel) { doc.querySelectorAll(sel).forEach(function (e) { e.classList.remove('br-x'); }); });
      overlay.remove();
      running = false;
      var ok = results.filter(Boolean).length;
      $('n-agents').textContent = '✓';
      agentsLabel = T.checks + ' ' + ok + '/' + results.length;
      $('agents-label').textContent = agentsLabel;
      log(T.director, '#c084fc', T.done + mmss(elapsed));
      if (CONFIG.loop) return wait(4000, r).then(start);
    }).catch(function (e) {
      if (e instanceof Stop) return;
      running = false;
      var m = e && e.message;
      fail(m === 'blocked' ? T.blocked : m === 'missing' ? T.missing + CONFIG.page : m === 'empty' ? T.empty : String(m || e));
    });
  }

  /* ---------- controls ---------- */

  $('view').onclick = function () { view = view === 'mobile' ? 'desktop' : 'mobile'; start(); };
  $('speed').onclick = function () { rate = rate === 4 ? 1 : rate * 2; speed = rate * tempo; $('speed').textContent = rate + 'x'; };
  $('details').onclick = function () { app.classList.toggle('details'); measure(); };
  $('pause').onclick = function () {
    paused = !paused;
    $('pause').innerHTML = paused ? '&#9654;' : '&#10074;&#10074;';
    $('pause').setAttribute('aria-label', paused ? 'Resume' : 'Pause');
  };
  $('replay').onclick = start;
  $('close').onclick = function () { $('bar').classList.add('hidden'); };
  addEventListener('keydown', function (e) {
    if (e.key === ' ') { e.preventDefault(); $('pause').click(); }
    if (e.key === 'r' || e.key === 'R') start();
    if (e.key === 'h' || e.key === 'H') $('bar').classList.toggle('hidden');
  });

  $('speed').textContent = rate + 'x';
  start();
})();
</script>
</body>
</html>
